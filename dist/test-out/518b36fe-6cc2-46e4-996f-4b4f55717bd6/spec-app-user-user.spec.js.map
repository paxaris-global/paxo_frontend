<div class="role-url-tab" [formGroup]="roleForm">
  <h3>Configure Role URLs</h3>

  <div class="form-row" style="display: flex; gap: 20px; margin-bottom: 20px;">
    <div class="form-group" style="flex: 1;">
      <label>Product</label>
      <select formControlName="product" class="form-control">
        <option value="" disabled>Select Product</option>
        <option *ngFor="let product of products" [value]="product">
          {{ product }}
        </option>
      </select>
    </div>

    <div class="form-group" style="flex: 1;">
      <label>Role</label>
      <select formControlName="selectedRole" class="form-control">
        <option value="" disabled>Select Role</option>
        <option *ngFor="let role of roles" [value]="role.name">
          {{ role.name }}
        </option>
      </select>
    </div>
  </div>

  <hr />

  <!-- OpenAPI Section -->
  <div class="openapi-section" style="margin-bottom: 20px;">
    <h4>Import from OpenAPI (Optional)</h4>
    <div class="file-input-row" style="margin-bottom: 10px;">
      <input type="file" (change)="openApiFileSelected.emit($event)" accept=".json,.yaml,.yml" />
      <button type="button" (click)="clearOpenApi.emit()" *ngIf="openApiEndpoints.length > 0">Clear</button>
    </div>

    <div *ngIf="openApiEndpoints.length > 0" class="endpoints-list" style="max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;">
      <div class="actions" style="margin-bottom: 10px;">
        <button type="button" (click)="selectAllEndpoints.emit()">Select All</button>
        <button type="button" (click)="deselectAllEndpoints.emit()">Deselect All</button>
        <button type="button" (click)="loadSelectedEndpoints.emit()" class="primary">Load Selected to Form</button>
      </div>
      <div class="endpoint-item" *ngFor="let endpoint of openApiEndpoints; let i = index">
        <label>
          <input type="checkbox" [checked]="endpoint.selected" (change)="toggleEndpointSelection.emit(i)" />
          <strong>{{ endpoint.method }}</strong> {{ endpoint.path }}
          <span *ngIf="endpoint.summary" style="color: #666;">- {{ endpoint.summary }}</span>
        </label>
      </div>
    </div>
  </div>

  <hr />

  <!-- URL/URI Pairs -->
  <h4>URL Permissions</h4>
  <div formArrayName="urlUriPairs">
    <div *ngFor="let pair of urlUriPairs.controls; let i = index" [formGroupName]="i" class="url-pair-row" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
      <div class="form-group">
        <label>Method</label>
        <select formControlName="httpMethod" class="form-control">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="DELETE">DELETE</option>
          <option value="PATCH">PATCH</option>
          <option value="*">*</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <label>URL (Base)</label>
        <input formControlName="url" class="form-control" placeholder="http://localhost:8080" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label>URI (Path)</label>
        <input formControlName="uri" class="form-control" placeholder="/api/resource" />
      </div>
      <button type="button" class="remove-btn" (click)="removeUrlUriPair.emit(i)" *ngIf="urlUriPairs.length > 1" style="margin-bottom: 2px;">
        <i class="fa fa-trash"></i> Remove
      </button>
    </div>
  </div>

  <div class="actions-row" style="margin-top: 20px;">
    <button type="button" (click)="addUrlUriPair.emit()">+ Add URL</button>
    <button type="button" class="save-btn" (click)="savePermissions.emit()" style="margin-left: 10px;">Save Permissions</button>
  </div>
</div>
