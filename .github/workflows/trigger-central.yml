name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Missing required GitHub secrets: DOCKER_USERNAME and/or DOCKER_PASSWORD"
            echo "Set them in Settings > Secrets and variables > Actions > Secrets"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t devopspaxarisglobalrepo/paxo_frontend:latest .

      - name: Push Docker Image
        run: docker push devopspaxarisglobalrepo/paxo_frontend:latest