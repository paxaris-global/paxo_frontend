name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Docker Hub credentials
        id: docker_creds
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing DOCKER_USERNAME/DOCKER_PASSWORD. Building image only; skipping Docker Hub push."
          fi

      - name: Login to Docker Hub
        if: steps.docker_creds.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t devopspaxarisglobalrepo/paxo_frontend:latest .

      - name: Push Docker Image
        if: steps.docker_creds.outputs.can_push == 'true'
        run: docker push devopspaxarisglobalrepo/paxo_frontend:latest