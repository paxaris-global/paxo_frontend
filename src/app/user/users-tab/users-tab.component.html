<div class="section section-users">
  <h3><i class="fa-solid fa-users"></i> Create User</h3>
  <div class="field">
    <label>Realm: <span class="required">*</span></label>
    <input type="text" [ngModel]="currentRealm" [ngModelOptions]="{standalone: true}" readonly placeholder="Realm name" />
  </div>
  <form [formGroup]="userForm" (ngSubmit)="createUser.emit()">
    <div class="field"><label>Username:</label><input formControlName="username" type="text" /></div>
    <div class="field"><label>Email:</label><input formControlName="email" type="email" /></div>
    <div class="field"><label>First Name:</label><input formControlName="firstName" type="text" /></div>
    <div class="field"><label>Last Name:</label><input formControlName="lastName" type="text" /></div>
    <div class="field"><label>Password:</label><input formControlName="password" type="password" /></div>
    <button type="submit" [disabled]="userForm.invalid || !currentRealm"><i class="fa-solid fa-plus-circle"></i> Create User</button>
  </form>

  <h4>Existing Users</h4>
  <table>
    <thead>
      <tr><th>Username</th><th>Email</th><th>First Name</th><th>Last Name</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.firstName }}</td>
        <td>{{ user.lastName }}</td>
     <td>
  <button type="button" (click)="openEditModal(user)">
  <i class="fa-solid fa-pen-to-square"></i> Edit
</button>
</td>

<td>
  <button type="button" (click)="deleteUser.emit(user)">
    <i class="fa-solid fa-trash"></i> Delete
  </button>
</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" *ngIf="showEditModal">
  <div class="modal">

    <h3>Edit User</h3>

    <form [formGroup]="editForm">

      <div class="field">
        <label>Username</label>
        <input formControlName="username" readonly />
      </div>

      <div class="field">
        <label>Email</label>
        <input formControlName="email" type="email" />
      </div>

      <div class="field">
        <label>First Name</label>
        <input formControlName="firstName" />
      </div>

      <div class="field">
        <label>Last Name</label>
        <input formControlName="lastName" />
      </div>

    </form>

    <div class="modal-actions">
      <button (click)="saveEdit()" [disabled]="editForm.invalid">
        Save
      </button>
      <button (click)="closeModal()">Cancel</button>
    </div>

  </div>
</div>
