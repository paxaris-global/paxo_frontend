<div class="user-page">

  <!-- Section Tabs (hidden when navigating via Client sidebar URLs) -->
  @if (showTabs) {
    <div class="tabs">
      <button [class.active]="activeSection === 'users'" (click)="setSection('users')">Users</button>
      <button [class.active]="activeSection === 'roles'" (click)="setSection('roles')">Roles</button>
      <button [class.active]="activeSection === 'assign'" (click)="setSection('assign')">Assign Roles</button>
    </div>
  }

  <!-- Users Tab -->
  @if (activeSection === 'users') {
    <app-users-tab
      [currentRealm]="currentRealm"
      [users]="users"
      [userForm]="userForm"
      (createUser)="createUser()"
    />
  }

  <!-- Roles Tab -->
  @if (activeSection === 'roles') {
    <app-roles-tab
      [roleForm]="roleForm"
      [clients]="clients"
      [roles]="roles"
      [openApiEndpoints]="openApiEndpoints"
      (createRole)="createRole()"
      (loadRoles)="loadRoles()"
      (addUrlUriPair)="addUrlUriPair()"
      (removeUrlUriPair)="removeUrlUriPair($event)"
      (openApiFileSelected)="onOpenApiFileSelected($event)"
      (toggleEndpointSelection)="toggleEndpointSelection($event)"
      (selectAllEndpoints)="selectAllEndpoints()"
      (deselectAllEndpoints)="deselectAllEndpoints()"
      (loadSelectedEndpointsToForm)="loadSelectedEndpointsToForm()"
      (clearOpenApiData)="clearOpenApiData()"
    />
  }

  <!-- Assign Role Tab -->
  @if (activeSection === 'assign') {
    <app-assign-role-tab
      [currentRealm]="currentRealm"
      [users]="users"
      [clients]="clients"
      [roles]="roles"
      [assignForm]="assignForm"
      (assignRole)="assignRole()"
    />
  }

  <!-- Logout -->
  <div class="logout">
    <button (click)="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
  </div>
</div>
