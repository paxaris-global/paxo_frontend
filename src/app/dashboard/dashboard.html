<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>⚙️ Admin</h2>

    <!-- <div class="sidebar-group"> -->
      <nav class="sidebar-children">
        <!-- <a [routerLink]="['client', 'products']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">📦 Products</a> -->
        <div class="sidebar-subgroup">
          <button type="button" class="sidebar-subgroup-toggle" (click)="usersAndRolesMenuOpen = !usersAndRolesMenuOpen" [attr.aria-expanded]="usersAndRolesMenuOpen">
            <span>👥 Users and Role</span>
            <span class="sidebar-chevron" [class.open]="usersAndRolesMenuOpen">▼</span>
          </button>
         <nav class="sidebar-subchildren" [class.open]="usersAndRolesMenuOpen">
  <a [routerLink]="['client', 'users']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">Users</a>
  <a [routerLink]="['client', 'roles']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">Roles</a>
  <a [routerLink]="['client', 'roleUrl']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">Assign URIs to Role</a>
  <a [routerLink]="['client', 'client']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">Create Product</a>
  <a [routerLink]="['client', 'assign-roles']" [queryParams]="{ realm: realmName }" routerLinkActive="active" class="sidebar-child">Assign Roles</a>
</nav>

        </div>
      </nav>
    <!-- </div> -->

    <!-- <a [routerLink]="['settings']" [queryParams]="{ realm: realmName }" routerLinkActive="active">⚙️ Settings</a> -->
  </aside>

  <!-- Content -->
  <main class="content">
    <header>
      <h1>Realm: <span>{{ realmName }}</span></h1>
      <p *ngIf="!loadingClients && realmName !== 'Unknown Realm'" class="realm-summary">
        {{ clients.length }} product(s) in this realm
      </p>
      <p *ngIf="loadingClients" class="realm-summary">Loading…</p>
    </header>

    <!-- SPA content loads here -->
    <router-outlet></router-outlet>
  </main>

</div>
