<div class="login-container">
  <h2>🔐 Keycloak Login</h2>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <label for="realm">Realm:</label>
  <input
    id="realm"
    type="text"
    [(ngModel)]="selectedRealm"
    placeholder="Enter Realm"
    list="realms-list"
  />
  <datalist id="realms-list">
    <option *ngFor="let realm of realms" [value]="realm"></option>
  </datalist>

  <label for="client">Client ID:</label>
  <input id="client" type="text" [(ngModel)]="selectedClientId" placeholder="Enter Client ID" />

  <label for="username">Username:</label>
  <input id="username" type="text" [(ngModel)]="username" placeholder="Enter username" />

  <label for="password">Password:</label>
  <input id="password" type="password" [(ngModel)]="password" placeholder="Enter password" />

  <button (click)="login()" [disabled]="loading">
    {{ loading ? 'Logging in...' : 'Login' }}
  </button>

  <!-- 🔹 Display token and base URL on page -->
  <div *ngIf="token && baseUrl" class="login-info">
    <p>🔐 Token: {{ token }}</p>
    <p>🌐 Base URL: {{ baseUrl }}</p>
  </div>
</div>
