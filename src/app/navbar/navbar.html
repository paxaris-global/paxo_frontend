<nav class="nav">
  <a routerLink="/" class="title">Paxaris Global</a>

  <div class="actions">
    @if (!loggedIn) {
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="btn ghost">Home</a>
      <a routerLink="/login" routerLinkActive="active" class="btn ghost">Login</a>
      <a routerLink="/signup" routerLinkActive="active" class="btn primary">Signup</a>
    } @else {
      <a routerLink="/dashboard" routerLinkActive="active" class="btn ghost">Dashboard</a>
      <a href="#" (click)="logout($event)" class="btn primary">Logout</a>
    }
  </div>
</nav>
