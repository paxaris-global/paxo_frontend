<div class="signup-wrapper">
  <div class="signup-card">
    <h2>🧩 Create New Realm, Admin & Docker Image</h2>
    <p class="subtitle">Setup Keycloak + Upload Docker Image automatically</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <!-- Realm Section -->
      <div class="section">
        <h3>🌐 Realm & Client</h3>

        <div class="field">
          <label>Realm Name</label>
          <input type="text" formControlName="realmName" placeholder="e.g. myRealmVip" readonly />
        </div>

        <div class="field">
          <label>Client / Product Name</label>
          <input type="text" formControlName="clientId" placeholder="e.g. myClientApp" />
        </div>

        <div class="field">
          <label>Base URL</label>
          <input type="text" formControlName="url" placeholder="https://example.com" />
        </div>

        <div class="field">
          <label>Redirect URI</label>
          <input type="text" formControlName="uri" placeholder="https://example.com/callback" />
        </div>
      </div>

      <!-- Admin User Section -->
      <div class="section">
        <h3>👤 Admin User</h3>

        <div class="field"><label>Username</label><input type="text" formControlName="username" /></div>
        <div class="field"><label>Email</label><input type="email" formControlName="email" /></div>
        <div class="field"><label>First Name</label><input type="text" formControlName="firstName" /></div>
        <div class="field"><label>Last Name</label><input type="text" formControlName="lastName" /></div>
        <div class="field"><label>Password</label><input type="password" formControlName="password" /></div>
      </div>

      <!-- Docker Upload Section -->
      <div class="section">
        <h3>project Upload</h3>

        <div class="field">
          <label>Select project</label>
          <input type="file" accept=".zip" (change)="onDockerFileSelected($event)" />
        </div>
      </div>
      

      <button type="submit" [disabled]="signupForm.invalid || loading">
        {{ loading ? 'Processing...' : 'Sign Up' }}
      </button>
    </form>

    <div *ngIf="message" class="message">{{ message }}</div>
  </div>
</div>
